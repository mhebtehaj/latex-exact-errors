name: Check and package

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install TeX and a display for editor tests
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-recommended xvfb
          pdflatex --version
      - run: npm run check
      - run: npm test
      - name: Test live feedback in an isolated VS Code window
        run: xvfb-run -a npm run test:live-host
      - name: Test compiler mapping in an isolated VS Code window
        run: xvfb-run -a npm run test:host
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: latex-exact-errors-vsix
          path: '*.vsix'
          if-no-files-found: error
