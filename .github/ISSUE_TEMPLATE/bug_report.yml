name: Bug report
description: Report a false warning, missed error, or installation problem.
labels: [bug]
assignees: [mhebtehaj]
body:
  - type: markdown
    attributes:
      value: |
        Reports are public and may be examined by an AI coding assistant to propose a fix. Share only a small example you are comfortable making public. Proposed fixes require maintainer review before release; the extension does not automatically upload documents or report errors.
  - type: input
    id: versions
    attributes:
      label: Versions and system
      description: Extension version, Cursor or VS Code version, operating system, and LaTeX Workshop version if installed.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Small LaTeX example
      description: Include relevant macro definitions and included files. Use a small example you can share publicly.
      render: latex
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: What happened, and what did you expect?
      description: Include steps, the highlighted token, and the hover or Problems message. Say whether it happens while typing or after compiling.
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: Relevant settings or logs
      description: Optional. Include changed LaTeX Exact settings; remove personal paths and private material from logs.
